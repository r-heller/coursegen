name: Validate template
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b
        with:
          version: '1.10.19'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/new_project.py output/example --title "Template validation" --author "R. Heller"
      - run: quarto render output/example --to html
      - name: Verify student artifact excludes instructor notes
        run: |
          test ! -e output/example/_site/instructor
          if rg -l 'Instructor answer key' output/example/_site; then exit 1; fi
      - run: python scripts/check_render.py output/example
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coursegen-example
          path: output/example/_site/
          if-no-files-found: error
